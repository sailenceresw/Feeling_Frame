name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Currently fails only on errors. Once analyzer debt (#38) is fully cleared
      # drop the --no-fatal-* flags so warnings also fail the build.
      - name: Analyze (fail on errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: feelm-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # TODO (#42): add a macos-latest job that runs
  #   flutter build ios --no-codesign
  # after pod install. Keep it gated to pull_request + main pushes
  # and cache the pods to control CI minutes.
