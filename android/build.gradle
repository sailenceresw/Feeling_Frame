allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// AGP 8 requires every Android module to declare a namespace. Some older
// Flutter plugins predate this; derive it from their manifest package so
// they keep building. (No-op for modules that already set a namespace.)
subprojects { p ->
    p.plugins.withId("com.android.library") {
        p.android {
            if (namespace == null) {
                def manifestFile = p.file("src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def parsed = new groovy.xml.XmlSlurper().parse(manifestFile)
                    def pkg = parsed.@package.text()
                    if (pkg) {
                        namespace = pkg
                    }
                }
            }
        }
    }

    // Old plugins compile Java at 1.8 while the Kotlin plugin now defaults to
    // JVM target 17, which fails with "Inconsistent JVM-target compatibility".
    // Force both Java and Kotlin to 17 for every Android module so they match.
    p.afterEvaluate {
        if (p.extensions.findByName('android') != null) {
            p.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            if (p.plugins.hasPlugin('org.jetbrains.kotlin.android')) {
                p.android {
                    kotlinOptions {
                        jvmTarget = '17'
                    }
                }
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
